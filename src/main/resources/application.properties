spring.application.name=BookLender

# File database, created in ./data the first time the application starts. Stopping the application leaves the file in place.
spring.datasource.url=jdbc:h2:file:./data/booklender;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=booklender
spring.datasource.password=booklender
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Borrowing rules live in configuration and are not stored in the database.
booklender.borrowing.max-active-loans=3
booklender.borrowing.loan-duration-days=14

# Predefined API users. Passwords are hashed at startup.
booklender.security.users[0].username=admin
booklender.security.users[0].password=admin
booklender.security.users[0].roles[0]=ADMIN
booklender.security.users[1].username=librarian
booklender.security.users[1].password=librarian
booklender.security.users[1].roles[0]=LIBRARIAN
booklender.security.users[2].username=member
booklender.security.users[2].password=member
booklender.security.users[2].roles[0]=MEMBER

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=BookLender
info.app.description=Book lending service

springdoc.show-actuator=true


server.port=8220